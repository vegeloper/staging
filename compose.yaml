name: dotone-trip

services:
  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - backend

  migrate:
    build:
      context: .
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    profiles:
      - migrate
      - full

  seed:
    build:
      context: .
      target: migrator
    restart: "no"
    command: ["npm", "run", "db:seed"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AUTH_PASSWORD_PEPPER: ${AUTH_PASSWORD_PEPPER:?AUTH_PASSWORD_PEPPER is required}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_OPERATOR_PASSWORD: ${SEED_OPERATOR_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    profiles:
      - seed

  resume-init:
    image: busybox:1.37
    user: "0:0"
    restart: "no"
    network_mode: none
    volumes:
      - ${RESUME_HOST_PATH:-resumes_data}:/data
    command:
      [
        "sh",
        "-c",
        "mkdir -p /data && chown -R 1000:1000 /data && chmod 775 /data",
      ]
    profiles:
      - full

  media-init:
    image: busybox:1.37
    user: "0:0"
    restart: "no"
    network_mode: none
    volumes:
      - ${MEDIA_HOST_PATH:-media_data}:/data
    command:
      [
        "sh",
        "-c",
        "mkdir -p /data && chown -R 1000:1000 /data && chmod 775 /data",
      ]
    profiles:
      - full

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - backend
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 12
      start_period: 180s
    profiles:
      - full

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_SSL: ${DATABASE_SSL:-disable}
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required}
      UPLOAD_ROOT: /app/data/resumes
      MEDIA_ROOT: /app/data/media
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      MAX_RESUME_BYTES: ${MAX_RESUME_BYTES:-5242880}
      MAX_MEDIA_IMAGE_BYTES: ${MAX_MEDIA_IMAGE_BYTES:-8388608}
      MAX_MEDIA_VIDEO_BYTES: ${MAX_MEDIA_VIDEO_BYTES:-67108864}
      AUTH_PASSWORD_PEPPER: ${AUTH_PASSWORD_PEPPER:?AUTH_PASSWORD_PEPPER is required}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?PII_ENCRYPTION_KEY is required}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    volumes:
      # Default named volume `resumes_data`. resume-init chowns uid 1000 so a
      # host bind (RESUME_HOST_PATH) also works without a manual chown.
      - ${RESUME_HOST_PATH:-resumes_data}:/app/data/resumes
      - ${MEDIA_HOST_PATH:-media_data}:/app/data/media
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      resume-init:
        condition: service_completed_successfully
      media-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    networks:
      - edge
      - backend
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    profiles:
      - full

volumes:
  postgres_data:
    name: dotone-trip-postgres-data
  resumes_data:
    name: dotone-trip-resumes-data
  media_data:
    name: dotone-trip-media-data
  clamav_data:
    name: dotone-trip-clamav-data

networks:
  edge:
    name: dotone-trip-edge
  backend:
    name: dotone-trip-backend
